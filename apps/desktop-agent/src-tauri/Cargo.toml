[package]
name = "edos-agent"
version = "0.1.0"
edition = "2021"
description = "edOS Desktop Agent"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open", "notification-all", "system-tray"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json", "blocking", "native-tls"] }
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1"
ureq = { version = "2", features = ["json"] }
url = "2"
# Cross-platform active window detection (macOS, Windows, Linux). Replaces the
# previous Windows-only implementation, which returned None on every other
# platform and left the agent monitoring nothing on macOS.
active-win-pos-rs = "0.11.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
