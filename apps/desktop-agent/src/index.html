<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>edOS Agent</title>
  <style>
    :root {
      --bg: #fbfbfc;
      --surface: #ffffff;
      --text: #111113;
      --muted: #71717a;
      --border: #e7e7ea;
      --accent: #3564d4;
      --accent-soft: #eef2fd;
      --danger: #b42318;
      --ok: #16a34a;
      --warn: #d97706;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text",
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f11;
        --surface: #17171a;
        --text: #f4f4f5;
        --muted: #8e8e98;
        --border: #26262b;
        --accent: #7c9cf0;
        --accent-soft: #1a2136;
        --danger: #f97066;
        --ok: #4ade80;
        --warn: #fbbf24;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
      padding: 18px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .hidden { display: none !important; }

    /* Header */
    .bar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    .pill .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
    }

    .pill.on .dot { background: var(--ok); }
    .pill.paused .dot { background: var(--warn); }

    /* Panels */
    .panel {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      overflow: hidden;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
    }

    .row + .row { border-top: 1px solid var(--border); }
    .row-label { font-size: 13px; color: var(--muted); }
    .row-value { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }

    .section-label {
      font-size: 11px;
      color: var(--muted);
      margin: 16px 0 7px;
    }

    /* Now-monitoring block */
    .now {
      padding: 12px;
    }

    .now .title {
      font-size: 13px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .now .meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }

    .tag {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      margin-left: 6px;
      vertical-align: 1px;
    }

    .tag.tracked { color: var(--accent); border-color: var(--accent); }

    /* Surface chips */
    .chips { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }

    .chip .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .chip.live { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
    .chip.idle { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }

    /* Event list */
    .events { max-height: 132px; overflow-y: auto; }

    .event {
      padding: 8px 12px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .event + .event { border-top: 1px solid var(--border); }

    .event .topic {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .event .meta { color: var(--muted); flex: none; font-size: 11px; }

    .empty {
      padding: 16px 12px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    /* Forms */
    label.field { display: block; margin-bottom: 8px; }

    label.field span {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 9px 11px;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      user-select: text;
      transition: border-color .12s, box-shadow .12s;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    button {
      width: 100%;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity .12s, background .12s, border-color .12s;
    }

    .btn-solid { background: var(--text); color: var(--bg); }
    .btn-solid:hover:not(:disabled) { opacity: .86; }
    .btn-solid:disabled { opacity: .32; cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border-color: var(--border);
    }

    .btn-ghost:hover { color: var(--text); background: var(--surface); }

    .stack > button + button { margin-top: 7px; }

    .msg {
      display: none;
      margin-top: 10px;
      padding: 9px 11px;
      font-size: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--danger);
    }

    .msg.visible { display: block; }
    .msg.info { color: var(--muted); }

    .note {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="bar">
    <span class="brand">edOS Agent</span>
    <span class="pill" id="statusPill"><span class="dot"></span><span id="statusText">Signed out</span></span>
  </div>

  <!-- Signed out -->
  <section id="loginSection">
    <div class="stack">
      <label class="field">
        <span>Email</span>
        <input type="email" id="email" placeholder="you@example.com">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="password" placeholder="••••••••">
      </label>
      <button type="button" class="btn-solid" id="loginBtn">Sign in</button>
    </div>
    <p class="msg" id="error" role="alert"></p>
    <p class="note" id="permNote"></p>
  </section>

  <!-- Signed in -->
  <section id="mainSection" class="hidden">
    <!-- Shared session. Starting here also activates the browser extension and
         the editor extension; ending here stops all of them. -->
    <p class="section-label">Session</p>
    <div class="panel">
      <div class="now" id="sessionBox">
        <p class="title" id="sessionTitle">No session</p>
        <p class="meta" id="sessionMeta">Start one here, or from the web app.</p>
      </div>

      <div class="row hidden" id="surfaceRow">
        <span class="row-label">Surfaces</span>
        <span class="chips" id="surfaceChips"></span>
      </div>

      <div style="padding:10px 12px; border-top:1px solid var(--border)">
        <label class="field hidden" id="topicField">
          <span>Topic</span>
          <input type="text" id="sessionTopic" placeholder="What are you learning?">
        </label>
        <button type="button" class="btn-solid" id="sessionBtn">Start session</button>
      </div>
    </div>

    <p class="msg" id="sessionMsg" role="status"></p>

    <p class="section-label">Now monitoring</p>
    <div class="panel">
      <div class="now" id="currentActivity">
        <p class="title">Waiting for activity</p>
        <p class="meta">The agent samples the focused window every 3 seconds.</p>
      </div>
    </div>

    <div class="panel" style="margin-top:16px">
      <div class="row">
        <span class="row-label">Account</span>
        <span class="row-value" id="userName">—</span>
      </div>
      <div class="row">
        <span class="row-label">Queued events</span>
        <span class="row-value" id="queueSize">0</span>
      </div>
      <div class="row">
        <span class="row-label">Monitoring</span>
        <span class="row-value" id="monitorStatus">Active</span>
      </div>
    </div>

    <p class="section-label">Recent activity</p>
    <div class="panel">
      <div class="events" id="recentEvents">
        <div class="empty">Nothing recorded yet</div>
      </div>
    </div>

    <div class="stack" style="margin-top:16px">
      <button type="button" class="btn-ghost" id="toggleBtn">Pause monitoring</button>
      <button type="button" class="btn-ghost" id="logoutBtn">Sign out</button>
    </div>

    <p class="note" id="permNoteMain"></p>
  </section>

  <script>
    const { invoke } = window.__TAURI__.tauri;
    const { listen } = window.__TAURI__.event;

    const $ = (id) => document.getElementById(id);

    // macOS hides window titles unless Screen Recording is granted. Surface
    // that instead of letting detection look silently broken.
    const isMac = navigator.userAgent.includes('Mac');
    let sawTitle = false;

    function permissionNote() {
      if (!isMac || sawTitle) return '';
      return 'macOS is not reporting window titles. Detection is running on application names only. ' +
             'Grant Screen Recording to edOS Agent in System Settings > Privacy & Security for full detail.';
    }

    function refreshPermissionNotes() {
      const text = permissionNote();
      ['permNote', 'permNoteMain'].forEach((id) => {
        const el = $(id);
        if (el) el.textContent = text;
      });
    }

    async function init() {
      try {
        const status = await invoke('get_status');
        if (status.logged_in) showMain(status);
        else showLogin();
      } catch {
        showLogin();
      }
      refreshPermissionNotes();
    }

    function showLogin() {
      sessionState = null;
      $('loginSection').classList.remove('hidden');
      $('mainSection').classList.add('hidden');
      $('statusPill').className = 'pill';
      $('statusText').textContent = 'Signed out';
    }

    function showMain(status) {
      $('loginSection').classList.add('hidden');
      $('mainSection').classList.remove('hidden');
      $('userName').textContent = status.user_name || '—';
      updateMonitorUI(status.monitoring);
      refreshSession();
    }

    /** Last session state, so the button knows whether to start or end. */
    let sessionState = null;
    /** Local pause switch, tracked so the status pill can explain itself. */
    let monitoringOn = true;

    function updateMonitorUI(isOn) {
      monitoringOn = isOn;
      $('monitorStatus').textContent = isOn ? 'Active' : 'Paused';
      $('toggleBtn').textContent = isOn ? 'Pause monitoring' : 'Resume monitoring';
      renderStatusPill();
    }

    /**
     * The pill distinguishes the reasons nothing is being captured. It used to
     * say "Monitoring" purely from the local switch, which read as active even
     * with no session running and nothing being recorded.
     */
    function renderStatusPill() {
      const pill = $('statusPill');
      const text = $('statusText');

      if (!sessionState || !sessionState.active) {
        pill.className = 'pill';
        text.textContent = 'No session';
        return;
      }

      if (!monitoringOn) {
        pill.className = 'pill paused';
        text.textContent = 'Paused here';
        return;
      }

      if (!sessionState.capturing) {
        pill.className = 'pill paused';
        text.textContent = 'Not capturing';
        return;
      }

      pill.className = 'pill on';
      text.textContent = 'Capturing';
    }

    const SURFACE_LABEL = {
      web: 'Web',
      desktop: 'Desktop',
      browser: 'Browser',
      ide: 'Editor',
    };

    const PERMISSION_LABEL = {
      screenContext: 'Screen context',
      browser: 'Browser activity',
      ide: 'Editor activity',
      documents: 'Documents',
      aiPlatforms: 'AI platforms',
    };

    function renderSession(status) {
      sessionState = status;
      renderStatusPill();

      const title = $('sessionTitle');
      const meta = $('sessionMeta');
      const btn = $('sessionBtn');
      const topicField = $('topicField');
      const surfaceRow = $('surfaceRow');

      if (!status || !status.active) {
        title.textContent = 'No session';
        meta.textContent = 'Start one here, or from the web app.';
        btn.textContent = 'Start session';
        btn.className = 'btn-solid';
        topicField.classList.remove('hidden');
        surfaceRow.classList.add('hidden');
        return;
      }

      title.textContent = status.topic || 'Learning session';
      btn.textContent = 'End session';
      btn.className = 'btn-ghost';
      topicField.classList.add('hidden');

      if (status.blockedPermission) {
        // Explain the silence rather than looking broken.
        const label = PERMISSION_LABEL[status.blockedPermission] || status.blockedPermission;
        meta.textContent = `Not capturing — turn on "${label}" in edOS settings.`;
      } else if (!monitoringOn) {
        meta.textContent = `Paused on this device · ${formatDuration(status.elapsedSeconds)}`;
      } else {
        const from = SURFACE_LABEL[status.initiatedBy] || status.initiatedBy || 'web';
        meta.textContent = `${formatDuration(status.elapsedSeconds)} · started on ${from}`;
      }

      const live = (status.surfaces || []).filter((s) => s.status !== 'left');
      surfaceRow.classList.toggle('hidden', live.length === 0);
      const chips = $('surfaceChips');
      chips.replaceChildren();

      live.forEach((s) => {
        const chip = document.createElement('span');
        chip.className = `chip ${s.status === 'live' ? 'live' : 'idle'}`;

        const dot = document.createElement('span');
        dot.className = 'dot';

        const label = document.createElement('span');
        label.textContent = SURFACE_LABEL[s.surface] || s.surface;

        chip.append(dot, label);
        chip.title = `${label.textContent} · ${s.status}`;
        chips.append(chip);
      });
    }

    function formatDuration(seconds) {
      const total = Math.max(0, Math.round(seconds || 0));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      if (h > 0) return `${h}h ${m}m`;
      if (m > 0) return `${m}m`;
      return `${total}s`;
    }

    function showSessionMsg(text, isError) {
      const el = $('sessionMsg');
      if (!text) {
        el.classList.remove('visible');
        return;
      }
      el.textContent = text;
      el.classList.toggle('info', !isError);
      el.classList.add('visible');
    }

    async function refreshSession() {
      try {
        renderSession(await invoke('get_session'));
      } catch {
        // Best effort; keep the last known state.
      }
    }

    $('sessionBtn').addEventListener('click', async () => {
      const btn = $('sessionBtn');
      const ending = Boolean(sessionState && sessionState.active);

      if (!ending) {
        const topic = $('sessionTopic').value.trim();
        if (!topic) {
          showSessionMsg('Enter what you are learning.', true);
          $('sessionTopic').focus();
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Starting';
        showSessionMsg('');

        try {
          renderSession(await invoke('start_session', { topic }));
          $('sessionTopic').value = '';
          await refreshSession();
        } catch (e) {
          showSessionMsg(typeof e === 'string' ? e : 'Could not start the session.', true);
        } finally {
          btn.disabled = false;
          renderSession(sessionState);
        }
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Ending';
      showSessionMsg('');

      try {
        await invoke('end_session');
        renderSession(null);
      } catch (e) {
        showSessionMsg(typeof e === 'string' ? e : 'Could not end the session.', true);
      } finally {
        btn.disabled = false;
        renderSession(sessionState);
      }
    });

    function showError(msg, info) {
      const el = $('error');
      el.textContent = msg;
      el.classList.toggle('info', Boolean(info));
      el.classList.add('visible');
    }

    function clearError() {
      $('error').classList.remove('visible');
    }

    $('loginBtn').addEventListener('click', async () => {
      const email = $('email').value.trim();
      const password = $('password').value;
      if (!email || !password) {
        showError('Enter your email and password.');
        return;
      }

      const btn = $('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in';
      showError('Connecting…', true);

      try {
        await invoke('login', { email, password });
        clearError();
        $('password').value = '';
        showMain(await invoke('get_status'));
      } catch (e) {
        showError(typeof e === 'string' ? e : 'Sign in failed.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });

    $('logoutBtn').addEventListener('click', async () => {
      await invoke('logout');
      showLogin();
    });

    $('toggleBtn').addEventListener('click', async () => {
      updateMonitorUI(await invoke('toggle_monitoring'));
    });

    function renderCurrent(title, process, seconds, educational) {
      if (title && title.trim()) sawTitle = true;
      const el = $('currentActivity');
      el.replaceChildren();

      const t = document.createElement('p');
      t.className = 'title';
      t.textContent = title || process || 'Unknown window';

      const m = document.createElement('p');
      m.className = 'meta';
      m.textContent = `${process || 'unknown app'} · ${seconds || 0}s`;

      const tag = document.createElement('span');
      tag.className = `tag${educational ? ' tracked' : ''}`;
      tag.textContent = educational ? 'Tracked' : 'Not tracked';
      m.append(tag);

      el.append(t, m);
      refreshPermissionNotes();
    }

    listen('monitor:activity', (event) => {
      const d = event.payload || {};
      renderCurrent(d.title, d.process, d.duration, d.educational);
    });

    setInterval(async () => {
      try {
        $('queueSize').textContent = await invoke('get_queue_size');

        const events = await invoke('get_recent_events');
        const list = $('recentEvents');
        list.replaceChildren();

        if (!events || events.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'Nothing recorded yet';
          list.append(empty);
        } else {
          events.forEach((e) => {
            const row = document.createElement('div');
            row.className = 'event';

            const topic = document.createElement('span');
            topic.className = 'topic';
            topic.textContent = e.topic || 'Unknown';

            const meta = document.createElement('span');
            meta.className = 'meta';
            meta.textContent = e.source || '';

            row.append(topic, meta);
            list.append(row);
          });
        }

        const win = await invoke('get_current_window');
        if (win && (win.title || win.process)) {
          renderCurrent(win.title, win.process, win.seconds, win.educational);
        }

        // Reflect sessions started or ended on another surface. The Rust side
        // refreshes this from the API on its own 30s tick.
        renderSession(await invoke('get_session'));
      } catch {
        // Panel is best-effort; ignore transient IPC errors.
      }
    }, 3000);

    init();
  </script>
</body>
</html>
