<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>edOS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; width: 360px; padding: 16px; background: #fff; color: #1a1b1e; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .status { font-size: 11px; padding: 2px 8px; border-radius: 12px; }
    .status.active { background: #d3f9d8; color: #2b8a3e; }
    .status.inactive { background: #ffe3e3; color: #c92a2a; }
    .status.paused { background: #fff3bf; color: #e67700; }
    .section { margin-bottom: 16px; }
    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #868e96; margin-bottom: 8px; font-weight: 600; }
    .card { background: #f8f9fa; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
    .stat { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
    .stat:last-child { margin-bottom: 0; }
    .stat-value { font-weight: 600; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
    .toggle-label { font-size: 13px; }
    .toggle { width: 36px; height: 20px; border-radius: 10px; background: #dee2e6; position: relative; cursor: pointer; transition: background 0.2s; }
    .toggle.on { background: #4c6ef5; }
    .toggle .knob { width: 16px; height: 16px; border-radius: 50%; background: white; position: absolute; top: 2px; left: 2px; transition: transform 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
    .toggle.on .knob { transform: translateX(16px); }
    .tab-list { max-height: 150px; overflow-y: auto; }
    .tab-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f1f3f5; font-size: 12px; }
    .tab-item:last-child { border-bottom: none; }
    .tab-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #51cf66; flex-shrink: 0; }
    .tab-item .dot.idle { background: #adb5bd; }
    .tab-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab-item .time { color: #868e96; font-size: 11px; flex-shrink: 0; }
    input { width: 100%; padding: 8px 12px; border: 1px solid #dee2e6; border-radius: 6px; font-size: 13px; margin-bottom: 8px; }
    button { width: 100%; padding: 8px 12px; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn-primary { background: #4c6ef5; color: #fff; }
    .btn-primary:hover { background: #4263eb; }
    .btn-secondary { background: #f1f3f5; color: #495057; margin-top: 6px; }
    .btn-secondary:hover { background: #e9ecef; }
    .empty { text-align: center; padding: 12px; color: #adb5bd; font-size: 12px; }
    #loginSection, #loggedInSection { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>edOS</h1>
    <span class="status inactive" id="status">Off</span>
  </div>

  <!-- Login Form -->
  <div id="loginSection">
    <div class="section">
      <div class="section-title">Sign In</div>
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />
      <button class="btn-primary" id="loginBtn">Sign In</button>
      <div id="loginError" style="color: #c92a2a; font-size: 11px; margin-top: 6px;"></div>
    </div>
  </div>

  <!-- Logged In View -->
  <div id="loggedInSection">
    <!-- On/Off Toggle -->
    <div class="section">
      <div class="card">
        <div class="toggle-row">
          <span class="toggle-label">Tracking Active</span>
          <div class="toggle" id="trackingToggle"><div class="knob"></div></div>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="section">
      <div class="card">
        <div class="stat">
          <span>User</span>
          <span class="stat-value" id="userName">—</span>
        </div>
        <div class="stat">
          <span>Events queued</span>
          <span class="stat-value" id="queueSize">0</span>
        </div>
        <div class="stat">
          <span>Tabs tracked</span>
          <span class="stat-value" id="tabCount">0</span>
        </div>
      </div>
    </div>

    <!-- Tracked Tabs -->
    <div class="section">
      <div class="section-title">Currently Tracked Tabs</div>
      <div class="card">
        <div class="tab-list" id="tabList">
          <div class="empty">No tabs being tracked</div>
        </div>
      </div>
    </div>

    <button class="btn-secondary" id="logoutBtn">Sign Out</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
