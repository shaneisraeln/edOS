<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>edOS</title>
  <link rel="stylesheet" href="quiz-popup.css">
  <style>
    /* Popup-specific layout on top of the shared minimal theme. */
    body {
      width: 340px;
      padding: 18px;
      min-height: 0;
    }

    .bar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    .pill .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }

    .pill.on .dot { background: #16a34a; }
    .pill.paused .dot { background: #d97706; }

    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
    }

    .row + .row {
      border-top: 1px solid var(--border);
    }

    .row-label {
      font-size: 13px;
      color: var(--muted);
    }

    .row-value {
      font-size: 13px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .section-label {
      font-size: 11px;
      color: var(--muted);
      margin: 18px 0 7px;
    }

    /* Switch */
    .switch {
      width: 34px;
      height: 20px;
      flex: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
      position: relative;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .switch .knob {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .switch.on {
      background: var(--text);
      border-color: var(--text);
    }

    .switch.on .knob {
      transform: translateX(14px);
      background: var(--surface);
    }

    .switch:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Tab list */
    .tabs {
      max-height: 148px;
      overflow-y: auto;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      font-size: 12px;
    }

    .tab + .tab {
      border-top: 1px solid var(--border);
    }

    .tab .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #16a34a;
      flex: none;
    }

    .tab .dot.idle { background: var(--border); }

    .tab .title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab .time {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      flex: none;
    }

    .empty {
      padding: 16px 12px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    /* Form */
    label.field {
      display: block;
      margin-bottom: 8px;
    }

    label.field span {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 9px 11px;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .stack > .btn { width: 100%; flex: none; }
    .stack > .btn + .btn { margin-top: 7px; }

    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.5;
    }

    details.advanced {
      margin-top: 14px;
    }

    details.advanced summary {
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      list-style: none;
    }

    details.advanced summary::-webkit-details-marker { display: none; }
    details.advanced summary::before { content: '+ '; }
    details.advanced[open] summary::before { content: '– '; }
    details.advanced > div { margin-top: 8px; }
  </style>
</head>
<body>
  <div class="bar">
    <span class="brand">edOS</span>
    <span class="pill" id="status"><span class="dot"></span><span id="statusText">Signed out</span></span>
  </div>

  <!-- Signed out -->
  <section id="loginSection" class="hidden">
    <div class="stack">
      <label class="field">
        <span>Email</span>
        <input type="email" id="email" autocomplete="username" placeholder="you@example.com">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
      </label>
      <button type="button" class="btn btn-solid" id="loginBtn">Sign in</button>
    </div>

    <p id="loginError" class="error" role="alert"></p>

    <details class="advanced">
      <summary>API endpoint</summary>
      <div>
        <input type="text" id="apiBase" placeholder="http://localhost:3001/api">
        <p class="hint">Point the extension at a different edOS API. Leave as-is for a local server.</p>
      </div>
    </details>
  </section>

  <!-- Signed in -->
  <section id="loggedInSection" class="hidden">
    <!-- Shared session. Capture only happens while one is running, and it can
         be started from any surface. -->
    <div class="panel" id="sessionPanel">
      <div class="row">
        <span class="min-w-0">
          <span class="row-label" id="sessionLabel">No session</span>
          <span class="hint" id="sessionDetail" style="margin-top:2px"></span>
        </span>
        <button type="button" class="btn btn-solid" id="sessionBtn" style="flex:none;min-width:74px;padding:7px 10px">Start</button>
      </div>
      <div class="row hidden" id="surfaceRow">
        <span class="row-label">Surfaces</span>
        <span class="row-value" id="surfaceList">—</span>
      </div>
    </div>

    <p class="section-label">Extension</p>
    <div class="panel">
      <div class="row">
        <span class="row-label">Tracking</span>
        <div class="switch" id="trackingToggle" role="switch" tabindex="0" aria-label="Toggle tracking">
          <div class="knob"></div>
        </div>
      </div>
      <div class="row">
        <span class="row-label">Account</span>
        <span class="row-value" id="userName">—</span>
      </div>
      <div class="row">
        <span class="row-label">Queued events</span>
        <span class="row-value" id="queueSize">0</span>
      </div>
    </div>

    <p class="section-label">Tracked tabs <span id="tabCount"></span></p>
    <div class="panel">
      <div class="tabs" id="tabList">
        <div class="empty">Nothing being tracked</div>
      </div>
    </div>

    <div class="stack" style="margin-top:16px">
      <button type="button" class="btn btn-ghost" id="logoutBtn">Sign out</button>
    </div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
