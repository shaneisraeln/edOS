<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick check</title>
  <link rel="stylesheet" href="quiz-popup.css">
</head>
<body>
  <!-- Loading -->
  <div id="loading" class="state">
    <div class="spinner" role="status" aria-label="Loading"></div>
  </div>

  <!-- Quiz -->
  <main id="quizSection" class="hidden">
    <header class="head">
      <p class="eyebrow">Quick check</p>
      <h1 id="topicTitle">Learning session</h1>
    </header>

    <div class="progress" role="progressbar" aria-label="Time remaining" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <p class="timer" id="timer"></p>

    <form id="questions" novalidate></form>

    <p id="error" class="error" role="alert"></p>

    <div class="actions">
      <button type="button" class="btn btn-ghost" id="skipBtn">Skip</button>
      <button type="button" class="btn btn-solid" id="submitBtn" disabled>Submit</button>
    </div>
  </main>

  <!-- Result -->
  <section id="resultSection" class="hidden">
    <div class="result">
      <p class="eyebrow">Your score</p>
      <p class="score" id="scoreDisplay">—</p>
      <p class="feedback" id="feedbackDisplay"></p>
      <button type="button" class="btn btn-solid" id="closeBtn">Done</button>
    </div>
  </section>

  <!-- No inline scripts: Manifest V3 blocks them under the extension CSP. -->
  <script type="module" src="quiz-popup.js"></script>
</body>
</html>
